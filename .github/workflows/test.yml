name: Tests

on:
  push:
    branches: [main]
  pull_request:

# A newer push to a branch supersedes the older run. Never on main: a cancelled check
# there is not a passing one.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Everything that needs no browser and no production build.
  checks:
    name: Checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: swingkings
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # The integration tests derive "swingkings_test" from this and migrate it themselves.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/swingkings
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/swingkings
      AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      # Critical only: what is left at "high" is fixed only by a major upgrade (Next 16,
      # Prisma 7) and is decided on its own, not by a red build on an unrelated change.
      - name: No known critical vulnerabilities in what is installed
        run: npm audit --audit-level=critical
      - name: Check migrations match the schema
        run: npm run db:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  # Beside the job above rather than behind it: they share nothing but setup. The browser
  # suite uses "swingkings_e2e" on a Postgres of its own.
  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: swingkings
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/swingkings
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/swingkings
      AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Work out which browser build is wanted
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install browser dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Run browser tests
        run: npm run e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # The one check a deploy gate waits for. Its name is the one the old single job had, so
  # a branch protection rule naming it keeps working. Green exactly when both jobs are.
  verify:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    needs: [checks, browser]
    if: always()
    steps:
      - name: Report what the suites did
        run: |
          echo "checks: ${{ needs.checks.result }}"
          echo "browser: ${{ needs.browser.result }}"
          [ "${{ needs.checks.result }}" = "success" ] && [ "${{ needs.browser.result }}" = "success" ]
