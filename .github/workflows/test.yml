name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: swingkings
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # The integration tests derive "swingkings_test" from this and migrate it themselves.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/swingkings
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/swingkings
      AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Check migrations match the schema
        run: npm run db:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx next build
